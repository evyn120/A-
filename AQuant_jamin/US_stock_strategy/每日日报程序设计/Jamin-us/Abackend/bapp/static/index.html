<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>福杰明美股决策看板</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">研究型决策辅助</p>
          <h1>福杰明美股决策看板</h1>
          <p class="hero-copy">
            每日美股复盘总结、异动监控、白名单股票强弱分布。
          </p>
        </div>
        <div class="hero-actions">
          <div class="hero-button-row">
            <button id="refreshButton" class="primary-button">立即刷新</button>
            <button id="logicButton" class="secondary-button" type="button">查看标签逻辑</button>
            <button id="btn-methodology" class="secondary-button">📐 评分方法论</button>
            <a id="btn-daily-report"
               class="secondary-button"
               href="/daily/"
               title="每日自动生成的港股+美股日报，由 LLM 生成">    📰 港美股日报  </a>
          </div>
          <p id="generatedAt" class="generated-at">等待加载...</p>
        </div>
      </header>

      <section class="panel panel-briefing">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">今日结论</p>
            <h2 id="briefingHeadline">读取中...</h2>
          </div>
          <div id="marketContext" class="market-context"></div>
        </div>
        <p id="briefingSummary" class="briefing-summary"></p>
        <div id="briefingLists" class="briefing-lists"></div>
      </section>

      <section class="metrics-grid" id="metricsGrid"></section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">我的自选股</p>
            <h2>添加任意美股进入打分</h2>
          </div>
        </div>
        <form id="addSymbolForm" class="add-symbol-form">
          <input
            id="addSymbolInput"
            name="symbol"
            type="text"
            placeholder="输入 symbol，例如 AMD / PLTR / AVGO"
            autocomplete="off"
            maxlength="12"
          />
          <button type="submit" class="primary-button">添加</button>
          <span id="addSymbolStatus" class="add-symbol-status"></span>
        </form>
        <p class="detail-copy subtle">
          内置的股票保留研究笔记；你自己加的股票由动态因子（EPS 预期修正、真动量、相对强弱、当日涨跌）自动打分。
        </p>
        <div id="userWatchlistChips" class="user-watchlist-chips"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">热力图</p>
            <h2>一屏看强弱分布</h2>
          </div>
        </div>
        <div id="heatmap" class="heatmap-grid"></div>
      </section>

      <div class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">股票池</p>
              <h2>核心观察列表</h2>
            </div>
          </div>
          <div id="groupTabs" class="group-tabs"></div>
          <div id="cardsContainer" class="cards-grid"></div>
        </section>

        <aside class="panel detail-panel">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">个股详情</p>
              <h2 id="detailTitle">点击任意卡片</h2>
            </div>
          </div>
          <div id="detailContent" class="detail-content">
            <p class="empty-state">加载后可查看该股票的研究结论、风险点和联动标的。</p>
          </div>
        </aside>
      </div>
    </div>

    <div id="breakdownModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="breakdownTitle">
        <div class="panel-header modal-header">
          <div>
            <p class="panel-kicker">打分明细</p>
            <h2 id="breakdownTitle">单股打分拆解</h2>
          </div>
          <button id="breakdownCloseButton" class="icon-button" type="button" aria-label="关闭明细">关闭</button>
        </div>
        <div id="breakdownContent" class="methodology-content">
          <div class="loading">请在卡片上点“查看打分明细”</div>
        </div>
      </div>
    </div>

    <div id="methodologyModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="methodologyTitle">
        <div class="panel-header modal-header">
          <div>
            <p class="panel-kicker">评分与标签说明</p>
            <h2 id="methodologyTitle">当前标签是怎么判出来的</h2>
          </div>
          <button id="logicCloseButton" class="icon-button" type="button" aria-label="关闭说明">关闭</button>
        </div>
        <div id="methodologyContent" class="methodology-content">
          <div class="loading">正在加载计算逻辑...</div>
        </div>
      </div>
    </div>

    <template id="metricTemplate">
      <article class="metric-card">
        <span class="metric-label"></span>
        <strong class="metric-value"></strong>
      </article>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
